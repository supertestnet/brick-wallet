    <script>
        var modalVanish = () => {
            $( ".black-bg" ).classList.add( "hidden" );
            $( ".modal" ).classList.add( "hidden" );
        }
        var showModal = ( content, block_til_clear ) => {
            if ( block_til_clear ) var fn = `modalVanish();sessionStorage[ 'modal_cleared' ] = true;`; else var fn = `modalVanish();`;
            $( ".modal" ).innerHTML = `<div class="x_modal" style="position: absolute;right: 1rem;top: 0.5rem;font-size: 2rem; cursor: pointer; color: black;" onclick="${fn}">&times;</div>`;
            $( ".modal" ).innerHTML += `<div style="overflow-y: auto; max-height: 80vh; margin-top: 1.5rem;">${content}</div>`;
            $( ".black-bg" ).classList.remove( "hidden" );
            $( ".modal" ).classList.remove( "hidden" );
        }
        var showToast = content => {
            $( '.toast' ).innerHTML = content;
            $( '.toast' ).classList.add( "show" );
            setTimeout( () => $( '.toast' ).classList.remove( "show" ), 3000 );
        }
        var createQR = content => {
            var dataUriPngImage = document.createElement( "img" ),
            s = QRCode.generatePNG( content, {
                ecclevel: "M",
                format: "html",
                fillcolor: "#FFFFFF",
                textcolor: "#000000",
                margin: 4,
                modulesize: 8,
            });
            dataUriPngImage.src = s;
            dataUriPngImage.className = "qr_code";
            dataUriPngImage.style.width = "100%";
            return dataUriPngImage;
        }
        sessionStorage.removeItem( "yes_send" );
        sessionStorage.removeItem( "modal_cleared" );
        async function getNote( item ) {
            async function isNoteSetYet( note_i_seek ) {
                return new Promise( function( resolve, reject ) {
                    if ( !note_i_seek ) {
                        setTimeout( async function() {
                            var msg = await isNoteSetYet( sessionStorage[ item ] );
                            resolve( msg );
                        }, 100 );
                    } else {
                        resolve( note_i_seek );
                    }
                });
            }
            async function getTimeoutData() {
                var note_i_seek = await isNoteSetYet( sessionStorage[ item ] );
                return note_i_seek;
            }
            var returnable = await getTimeoutData();
            return returnable;
        }
        var getData = url => {
            return new Promise( async function( resolve, reject ) {
                function inner_get( url ) {
                    var xhttp = new XMLHttpRequest();
                    xhttp.open( "GET", url, true );
                    xhttp.send();
                    return xhttp;
                }
                var data = inner_get( url );
                data.onerror = function( e ) {
                    resolve( "error" );
                }
                async function isResponseReady() {
                    return new Promise( function( resolve2, reject ) {
                        if ( !data.responseText || data.readyState != 4 ) {
                            setTimeout( async function() {
                                var msg = await isResponseReady();
                                resolve2( msg );
                            }, 1 );
                        } else {
                            resolve2( data.responseText );
                        }
                    });
                }
                var returnable = await isResponseReady();
                resolve( returnable );
            });
        }

        var getBitcoinPriceFromCoinbase = async () => {
            var data = await getData( "https://api.coinbase.com/v2/prices/BTC-USD/spot" );
            if ( data == "error" ) return 0;
            var json = JSON.parse( data );
            var price = json[ "data" ][ "amount" ];
            return price;
        }

        var getBitcoinPriceFromKraken = async () => {
            var data = await getData( "https://api.kraken.com/0/public/Ticker?pair=XBTUSD" );
            if ( data == "error" ) return 0;
            var json = JSON.parse( data );
            var price = json[ "result" ][ "XXBTZUSD" ][ "a" ][ 0 ];
            return price;
        }

        var getBitcoinPriceFromGemini = async () => {
            var data = await getData( "https://api.gemini.com/v2/ticker/BTCUSD" );
            if ( data == "error" ) return 0;
            var json = JSON.parse( data );
            var price = json[ "bid" ];
            return price;
        }

        var getBitcoinPriceFromCoinGecko = async () => {
            var data = await getData( "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&precision=2" );
            if ( data == "error" ) return 0;
            var json = JSON.parse( data );
            var price = json[ "bitcoin" ][ "usd" ];
            return price;
        }

        var getBitcoinPrice = async () => {
            var prices = [];
            var cbprice = await getBitcoinPriceFromCoinbase();
            var kprice = await getBitcoinPriceFromKraken();
            var cdprice = 0;
            var gprice = await getBitcoinPriceFromGemini();
            var cgprice = await getBitcoinPriceFromCoinGecko();
            prices.push( Number( cbprice ), Number( kprice ), Number( cdprice ), Number( gprice ), Number( cgprice ) );
            prices.sort();
            return prices[ 2 ];
        }
    </script>

    <script>
        var stop_the_save;
        var brick_wallet = {
            network: "testnet",
            state: {
                last_tx: 1,
                offset: 0,
                history: [],
                selected_currencies: [],
                supported_currencies: [],
                addresses: {},
                utxos: {},
            },
            loaded: false,
            waitSomeTime: async milliseconds => new Promise( resolve => setTimeout( resolve, milliseconds ) ),
            hexToBytes: hex => Uint8Array.from( hex.match( /.{1,2}/g ).map( byte => parseInt( byte, 16 ) ) ),
            bytesToHex: bytes => bytes.reduce( ( str, byte ) => str + byte.toString( 16 ).padStart( 2, "0" ), "" ),
            getInvoicePmthash: invoice => {
                var decoded = bolt11.decode( invoice );
                var i; for ( i=0; i<decoded[ "tags" ].length; i++ ) {
                    if ( decoded[ "tags" ][ i ][ "tagName" ] == "payment_hash" ) var pmthash = decoded[ "tags" ][ i ][ "data" ].toString();
                }
                return pmthash;
            },
            hexToText: hex => {
                var bytes = new Uint8Array( Math.ceil( hex.length / 2 ) );
                for ( var i = 0; i < hex.length; i++ ) bytes[ i ] = parseInt( hex.substr( i * 2, 2 ), 16 );
                var text = new TextDecoder().decode( bytes );
                return text;
            },
            textToHex: text => {
                var encoded = new TextEncoder().encode( text );
                return Array.from( encoded )
                    .map( x => x.toString( 16 ).padStart( 2, "0" ) )
                    .join( "" );
            },
            init: async () => {
                if ( brick_wallet.loaded ) await brick_wallet.waitSomeTime( 3000 );
                if ( Object.keys( brick_wallet.state.history ).length ) {
                    if ( !brick_wallet.loaded ) brick_wallet.parseHistory();
                } else {
                    if ( brick_wallet.loaded ) $( '.history' ).innerText = 'No history';
                }
                brick_wallet.loaded = true;
                var txs = [];
                var txs_found = {}
                txs.forEach( ( new_tx, index ) => {
                    new_tx[ "detail_hidden" ] = true;
                    txs_found[ new_tx[ "payment_hash" ] ] = new_tx;
                });
                if ( txs.length ) {
                    brick_wallet.state.history = { ...txs_found, ...brick_wallet.state.history };
                    brick_wallet.state.last_tx = txs[ txs.length - 1 ].created_at;
                    brick_wallet.parseHistory();
                }
                var income = 0;
                var expenses = 0;
                Object.keys( brick_wallet.state.history ).forEach( item => {
                    if ( item.startsWith( "i" ) ) income = income + brick_wallet.state.history[ item ].amount;
                    else expenses = expenses + brick_wallet.state.history[ item ].amount + brick_wallet.state.history[ item ].fees_paid;
                });
                balance.setState(()=>{balance.bal = income - expenses });
                brick_wallet.init();
            },
            parseHistory: () => {
                var history = [];
                Object.keys( brick_wallet.state.history ).forEach( txid => history.push( brick_wallet.state.history[ txid ] ) );
                history.sort( ( a, b ) => b[ "settled_at" ] - a[ "settled_at" ] );
                var remove_before = brick_wallet.state.offset * 5;
                history.splice( 0, remove_before );
                history.length = 5;
                var html = ``;
                if ( history.length ) {
                    $( '.hist_btns' ).classList.remove( "hidden" );
                    var len_of_hist = Object.keys( brick_wallet.state.history ).length;
                    if ( ( brick_wallet.state.offset + 1 ) * 5 >= len_of_hist ) $( '.hist_fwd' ).disabled = true;
                    else $( '.hist_fwd' ).disabled = false;
                    if ( !brick_wallet.state.offset ) $( '.hist_back' ).disabled = true;
                    else $( '.hist_back' ).disabled = false;
                    if ( brick_wallet.state.offset < 0 ) brick_wallet.state.offset = 0;
                    $( '.hist_fwd' ).onclick = () => {
                        if ( $( '.hist_fwd' ).disabled ) return;
                        var len_of_hist = Object.keys( brick_wallet.state.history ).length;
                        if ( ( brick_wallet.state.offset + 2 ) * 5 >= len_of_hist ) $( '.hist_fwd' ).disabled = true;
                        $( '.hist_back' ).disabled = false;
                        brick_wallet.state.offset = brick_wallet.state.offset + 1;
                        brick_wallet.parseHistory();
                    }
                    $( '.hist_back' ).onclick = () => {
                        if ( $( '.hist_back' ).disabled ) return;
                        $( '.hist_fwd' ).disabled = false;
                        brick_wallet.state.offset = brick_wallet.state.offset - 1;
                        if ( brick_wallet.state.offset < 0 ) brick_wallet.state.offset = 0;
                        if ( !brick_wallet.state.offset ) $( '.hist_back' ).disabled = true;
                        brick_wallet.parseHistory();
                    }
                }
                history.forEach( tx => {
                    if ( !tx ) return;
                    var txid = tx[ "txid" ];
                    var invoice;
                    if ( "address" in tx ) address = tx[ "address" ];
                    if ( $( '.address_box' ) && $( '.address_box' ).innerText === invoice ) {
                        if ( !$( '.modal' ).classList.contains( "hidden" ) ) $( '.x_modal' ).click();
                        $( '.address_box' ).innerText = "";
                    }
                    var arrow = `<span class="noselect arrow incoming_arrow">&#8601;</span>`;
                    var incoming_or_outgoing = "incoming_tx";
                    if ( tx[ "type" ] === "outgoing" ) {
                        arrow = `<span class="noselect arrow outgoing_arrow">&#8599;</span>`;
                        incoming_or_outgoing = "outgoing_tx";
                    }
                    var amount = tx[ "amount" ];
                    var amount_plus_fees = amount + tx[ "fees_paid" ];
                    var self_send_div = "";
                    if ( tx[ "type" ] === "outgoing" && Object.keys( brick_wallet.state.addresses ).includes( tx[ "address" ] ) ) {
                        self_send_div = `
                            <div class="tx_detail">
                                <p>Self send</p>
                                <p class="self_send_div">true</p>
                            </div>
                        `;
                        amount_plus_fees = tx[ "fees_paid" ];
                    }
                    var desc_div = `
                        <div class="tx_detail_big">
                            <p style="font-weight: bold;">Description</p>
                            <p class="desc_div"></p>
                        </div>
                    `;
                    var address_div = "";
                    if ( "address" in tx && tx[ "address" ] ) address_div = `
                        <div class="tx_detail_big">
                            <p style="font-weight: bold;">Address</p>
                            <p>${tx[ "address" ]}</p>
                        </div>
                    `;
                    var txid_div = "";
                    if ( "txid" in tx && tx[ "txid" ] ) txid_div = `
                        <div class="tx_detail_big">
                            <p style="font-weight: bold;">Txid</p>
                            <p>${tx[ "txid" ]}</p>
                        </div>
                    `;
                    var hidden_or_shown = tx[ "detail_hidden" ] ? "hidden" : "";
                    var identifier = tx[ "type" ] === "incoming" ? "i_" + txid : "o_" + txid;
                    var txdata = `
                        <div class="clickable_tx_parent" data-txid="${txid}" data-identifier="${identifier}">
                            <div class="clickable_tx ${incoming_or_outgoing}">
                                ${arrow}
                                <span class="noselect tx_amt" data-sats="${amount_plus_fees}">${amount_plus_fees} sats</span>
                            </div>
                            <div class="hidable_tx_data ${hidden_or_shown}">
                                <div class="tx_detail">
                                    <span>Amount</span><span>${amount} sats</span>
                                </div>
                                <div class="tx_detail">
                                    <span>Fees</span><span>${tx[ "fees_paid" ]} sats</span>
                                </div>
                                <div class="tx_detail">
                                    <span>Time</span><div>${new Date( tx[ "settled_at" ] * 1000 ).toLocaleDateString( "en-CA" ) + "<br>" + new Date( tx[ "settled_at" ] * 1000 ).toLocaleTimeString()}</div>
                                </div>
                                <div class="tx_detail">
                                    <span>Confirmed</span><span>${!!tx[ "confirmed" ]}</span>
                                </div>
                                ${self_send_div}
                                ${desc_div}
                                ${txid_div}
                                ${address_div}
                            </div>
                        </div>
                    `;
                    html = html + txdata;
                });
                var div = document.createElement( "div" );
                div.innerHTML = html;
                history.forEach( ( tx, index ) => {
                    if ( !tx ) return;
                    div.getElementsByClassName( "desc_div" )[ index ].innerText = tx[ "description" ] || "[No description]"
                });
                $( '.history' ).innerHTML = '';
                $( '.history' ).append( div );
                $$( '.clickable_tx' ).forEach( item => {
                    item.onclick = () => {
                        var parent = item.parentElement;
                        var identifier = parent.getAttribute( "data-identifier" );
                        var hidable = parent.getElementsByClassName( "hidable_tx_data" )[ 0 ];
                        if ( !hidable.classList.contains( "hidden" ) ) {
                            brick_wallet.state.history[ identifier ][ "detail_hidden" ] = true;
                            hidable.classList.add( "hidden" );
                        } else {
                            brick_wallet.state.history[ identifier ][ "detail_hidden" ] = false;
                            hidable.classList.remove( "hidden" );
                        }
                    }
                });
                var income = 0;
                var expenses = 0;
                Object.keys( brick_wallet.state.history ).forEach( item => {
                    if ( item.startsWith( "i" ) ) income = income + brick_wallet.state.history[ item ].amount;
                    else expenses = expenses + brick_wallet.state.history[ item ].amount + brick_wallet.state.history[ item ].fees_paid;
                });
                balance.setState(()=>{balance.bal = income - expenses });
            },
            send: async address => {
                var conf = true;
                if ( !address ) return;
                var amount = Number( prompt( `enter the amount you want to send (in sats)` ) );
                if ( amount < 546 ) return alert( `you cannot send an amount less than 546 sats` );
                $( '.address_box' ).innerText = address;
                showModal( `<p>sending...</p>` );
                await brick_wallet.waitSomeTime( 2000 );
                var delay_tolerance = 10;
                var [ txid, vout, fees_paid, change_address, txid, change_vout, change_amnt, change_privkey ] = await brick_wallet.getTxidVoutAndFeesPaid( address, amount );
                var new_txs = {}
                var new_tx = {address, txid, vout, amount, type: "outgoing", fees_paid, settled_at: Math.floor( Date.now() / 1000 ), confirmed: false}

                        vout: utxo.vout,

                            value: utxo.amnt,

                        value: sum_of_inputs - amount,

                    if ( !psbt.vout.length ) return 'error';
                    var size_of_psbt = tapscript.Tx.util.getTxSize( tapscript.Tx.create( psbt ) ).vsize;
                    var fee_needed = feerate * size_of_psbt;
                    var sum_of_inputs = 0;
                    var sum_of_outputs = 0;
                    psbt.vin.forEach( input => sum_of_inputs = sum_of_inputs + Number( input.prevout.value ) );

                    var remaining_fee_needed = fee_needed - fee_so_far;
                    psbt.vout.forEach( ( vout, index ) => psbt.vout[ index ].value = Number( vout.value ) );
                    var temp_psbt = JSON.parse( JSON.stringify( psbt ) );

                        temp_psbt.vout[ temp_psbt.vout.length - 1 ].value = temp_psbt.vout[ temp_psbt.vout.length - 1 ].value - remaining_fee_needed;

                        return subtractFeesFromOutputs( temp_psbt, feerate );
                    }

                var feerate = 1;

                    var sig = tapscript.Signer.taproot.sign( utxo.skey, psbt, index ).hex;
                    psbt.vin[ index ].witness = [ sig ];
                });
                var sum_of_outputs = 0;
                psbt.vout.forEach( output => sum_of_outputs = sum_of_outputs + Number( output.value ) );
                var fees_paid = sum_of_inputs - sum_of_outputs;
                var txhex = tapscript.Tx.encode( psbt ).hex;
                var txid = await chain_client.commander( $_HASH.network.split( "," ), "broadcast", txhex );

                    if ( o_addy !== address ) return true;

                });
                var change_vout = -1;
                var change_amnt = 0;
                tapscript.Tx.decode( txhex ).vout.reverse().every( ( output, index ) => {
                    var o_addy = tapscript.Address.fromScriptPubKey( output.scriptPubKey, brick_wallet.network );
                    if ( o_addy !== change_address ) return true;
                    change_vout = ( tapscript.Tx.decode( txhex ).vout.length - 1 ) - index;
                    change_amnt = Number( output.value );
                });
                inputs_ill_use.forEach( utxo_id => delete brick_wallet.state.utxos[ utxo_id ] );
                return [ txid, vout, fees_paid, change_address, txid, change_vout, change_amnt, change_privkey ];
            },
        }
